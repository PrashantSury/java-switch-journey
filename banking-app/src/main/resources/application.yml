spring:
  application:
    name: banking-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/java_switch}
    username: ${DB_USERNAME:banking_app}
    password: ${DB_PASSWORD:}          # set as env var, never commit it
  jpa:
    hibernate:
      ddl-auto: validate               # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
    schemas: auth,core
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080
