spring:
  application:
    name: banking-app

  # Runtime connection: banking_app (DML only). No defaults for secrets on purpose.
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}

  # Migrations run as banking_migrator (owns schemas, can do DDL).
  flyway:
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}
    # Flyway history table stays in public; V1 creates auth, core, audit.
    default-schema: public
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          # e.g. file:C:/dev/keys/jwt-public.pem
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

server:
  port: ${SERVER_PORT:9078}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
