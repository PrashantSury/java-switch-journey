# Test profile: in-memory H2, Flyway OFF (migrations use PostgreSQL-only syntax:
# regex CHECKs, INET, partial indexes, gen_random_uuid). Switch to Testcontainers in week 3.
spring:
  datasource:
    url: jdbc:h2:mem:banking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
